name: GitHub Activity Graph

on:
  schedule:
    - cron: '0 0 * * *'  # runs once a day at midnight UTC
  workflow_dispatch:      # lets you trigger it manually anytime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Ashutosh00710/github-readme-activity-graph@v1
        with:
          github_username: theanamsaqib
          # Options below are all optional — tweak as you like
          bg_color: '00000000'
          color: '2ea043'
          line: '2ea043'
          point: 'c9d1d9'
          area: true
          hide_border: true
          committer_email: 'action@github.com'
          committer_username: 'Github Activity Graph action'
          output: 'github-contribution-grid-snake-dark.svg'  # can rename, e.g. graph.svg
